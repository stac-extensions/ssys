<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Helvetica, Arial, sans-serif">
  <title>North and subsolar azimuths in the image plane</title>
  <style>
    .ink { fill: #24292f; }
    .s-ink { stroke: #24292f; fill: none; }
    .line { stroke: #57606a; fill: none; }
    .grid { stroke: #8c959f; fill: none; }
    .globe { fill: #eaeef2; stroke: #57606a; }
    .frame { fill: #f6f8fa; stroke: #57606a; }
    .footprint { fill: #0969da; fill-opacity: 0.15; stroke: #0969da; }
    .muted { fill: #57606a; }
    .s-north { stroke: #0969da; fill: none; }
    .f-north { fill: #0969da; }
    .s-sun { stroke: #bf6c00; fill: none; }
    .f-sun { fill: #bf6c00; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e6edf3; }
      .s-ink { stroke: #e6edf3; }
      .line { stroke: #9198a1; }
      .grid { stroke: #6e7681; }
      .globe { fill: #21262d; stroke: #9198a1; }
      .frame { fill: #161b22; stroke: #9198a1; }
      .footprint { fill: #4c9cf0; fill-opacity: 0.2; stroke: #4c9cf0; }
      .muted { fill: #9198a1; }
      .s-north { stroke: #4c9cf0; }
      .f-north { fill: #4c9cf0; }
      .s-sun { stroke: #f0a63a; }
      .f-sun { fill: #f0a63a; }
    }
  </style>
  <defs>
    <marker id="arrow-north" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="f-north"/>
    </marker>
    <marker id="arrow-sun" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="f-sun"/>
    </marker>
    <marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="muted"/>
    </marker>
  </defs>

  <!-- ===== Left panel: target body, north up, with the image footprint ===== -->
  <text x="180" y="30" font-size="13" text-anchor="middle" class="ink">on the target (north up)</text>
  <circle cx="180" cy="210" r="140" class="globe" stroke-width="1.5"/>
  <g class="grid" stroke-width="0.8">
    <ellipse cx="180" cy="210" rx="60" ry="140"/>
    <ellipse cx="180" cy="210" rx="110" ry="140"/>
    <line x1="40" y1="210" x2="320" y2="210"/>
    <line x1="59" y1="140" x2="301" y2="140"/>
    <line x1="59" y1="280" x2="301" y2="280"/>
  </g>
  <circle cx="180" cy="70" r="4" class="ink"/>
  <text x="180" y="60" font-size="13" text-anchor="middle" class="ink">north pole</text>

  <!-- Meridian through the footprint center: direction to the north pole -->
  <line x1="180" y1="200" x2="180" y2="78" class="s-north" stroke-width="2" marker-end="url(#arrow-north)"/>

  <!-- Footprint of the image, rotated 20° clockwise with respect to north -->
  <g transform="rotate(20 180 200)">
    <rect x="135" y="168" width="90" height="64" class="footprint" stroke-width="1.5"/>
    <line x1="135" y1="168" x2="225" y2="168" class="s-ink" stroke-width="3"/>
    <circle cx="135" cy="168" r="4" class="ink"/>
    <text x="207" y="161" font-size="10" text-anchor="middle" class="ink">top edge</text>
  </g>
  <circle cx="180" cy="200" r="3" class="ink"/>
  <text x="250" y="250" font-size="11" class="f-north">image footprint</text>

  <!-- Subsolar point on the target -->
  <circle cx="103.4" cy="264.3" r="7" class="f-sun"/>
  <text x="96" y="294" font-size="11" text-anchor="middle" class="f-sun">subsolar point</text>

  <text x="180" y="375" font-size="11" text-anchor="middle" class="muted">target body</text>

  <!-- ===== Transition ===== -->
  <line x1="345" y1="190" x2="405" y2="190" class="line" stroke-width="1.5" marker-end="url(#arrow-line)"/>
  <text x="375" y="178" font-size="11" text-anchor="middle" class="muted">displayed</text>

  <!-- ===== Right panel: the image as displayed ===== -->
  <text x="570" y="30" font-size="13" text-anchor="middle" class="ink">image, as displayed per its Display_Direction</text>
  <rect x="430" y="90" width="280" height="200" class="frame" stroke-width="1.5"/>
  <line x1="430" y1="90" x2="710" y2="90" class="s-ink" stroke-width="3"/>
  <circle cx="430" cy="90" r="4" class="ink"/>
  <text x="430" y="80" font-size="11" class="muted">top edge of the image (first line)</text>

  <!-- Reference line -->
  <line x1="570" y1="190" x2="707" y2="190" class="line" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-line)"/>
  <text x="702" y="206" font-size="11" text-anchor="end" class="muted">0°</text>
  <text x="576" y="284" font-size="11" class="muted">90°</text>
  <text x="438" y="186" font-size="11" class="muted">180°</text>
  <text x="576" y="106" font-size="11" class="muted">270°</text>

  <!-- North azimuth = 250° -->
  <line x1="570" y1="190" x2="541" y2="110" class="s-north" stroke-width="2" marker-end="url(#arrow-north)"/>
  <text x="530" y="124" font-size="11" text-anchor="end" class="f-north">to north pole</text>
  <path d="M610,190 A40,40 0 1,1 556.3,152.4" class="s-north" stroke-width="2" marker-end="url(#arrow-north)"/>

  <!-- Subsolar azimuth = 120° -->
  <line x1="570" y1="190" x2="530" y2="259" class="s-sun" stroke-width="2"/>
  <circle cx="527.5" cy="263.6" r="7" class="f-sun"/>
  <path d="M596,190 A26,26 0 0,1 557,212.5" class="s-sun" stroke-width="2" marker-end="url(#arrow-sun)"/>

  <circle cx="570" cy="190" r="4.5" class="ink"/>
  <text x="578" y="181" font-size="11" class="ink">center</text>

  <!-- Legend -->
  <g font-size="12">
    <text x="430" y="318" class="f-north">north_azimuth = 250°</text>
    <text x="430" y="336" class="f-sun">sub_solar_azimuth = 120°</text>
  </g>
  <text x="430" y="360" font-size="11" class="muted">
    <tspan x="430">Measured from the reference line, clockwise, 0–360°.</tspan>
    <tspan x="430" dy="14">270° means north is up.</tspan>
  </text>
</svg>
